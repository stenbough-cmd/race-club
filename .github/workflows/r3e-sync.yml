# Keeps the site's RaceRoom pictures, car details and track details complete and current.
# tools/r3e-sync.mjs: data file + pictures.   tools/r3e-cars.mjs: car details from the store pages.
# tools/r3e-tracks.mjs: track details, pictures, layout maps and venue logos from the store pages.
# Runs by itself every day with nothing for anyone to do. It can also be started by hand:
# GitHub, Actions tab, "RaceRoom pictures", "Run workflow".
name: RaceRoom pictures

on:
  schedule:
    - cron: '17 6 * * *'        # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      recheck:
        description: 'Ask the store again about pictures it did not have before'
        type: boolean
        default: false

permissions:
  contents: write                # lets the job save the new pictures into the repo

concurrency:
  group: r3e-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update the data and download missing pictures
        run: |
          FLAGS=""
          # On a hand-started run with the box ticked, and every Monday, ask the store again about missing pictures.
          if [ "${{ github.event.inputs.recheck }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then FLAGS="--recheck-missing"; fi
          node tools/r3e-sync.mjs $FLAGS

      - name: Install the hidden browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Download missing car details
        continue-on-error: true      # a store problem here must not lose the pictures saved above
        run: |
          FLAGS=""
          # On a hand-started run with the box ticked, and every Monday, open every car page again.
          if [ "${{ github.event.inputs.recheck }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then FLAGS="--refresh --recheck-missing"; fi
          node tools/r3e-cars.mjs $FLAGS

      - name: Download missing track details and pictures
        continue-on-error: true      # a store problem here must not lose what was saved above
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.recheck }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then FLAGS="--refresh --recheck-missing"; fi
          node tools/r3e-tracks.mjs $FLAGS

      - name: Save anything new into the repo
        if: always()
        run: |
          git config user.name "Race Club picture sync"
          git config user.email "actions@users.noreply.github.com"
          git add raceroom-data/r3e-data.json assets/r3e
          if git diff --cached --quiet; then
            echo "Nothing new today."
          else
            git commit -m "Update RaceRoom data, pictures, car and track details"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Update the data and download missing pictures
        run: |
          FLAGS=""
          # On a hand-started run with the box ticked, and every Monday, ask the store again about missing pictures.
          if [ "${{ github.event.inputs.recheck }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then FLAGS="--recheck-missing"; fi
          node tools/r3e-sync.mjs $FLAGS

      - name: Install the hidden browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Download missing car details
        continue-on-error: true      # a store problem here must not lose the pictures saved above
        run: |
          FLAGS=""
          # On a hand-started run with the box ticked, and every Monday, open every car page again.
          if [ "${{ github.event.inputs.recheck }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then FLAGS="--refresh --recheck-missing"; fi
          node tools/r3e-cars.mjs $FLAGS

      - name: Save anything new into the repo
        if: always()
        run: |
          git config user.name "Race Club picture sync"
          git config user.email "actions@users.noreply.github.com"
          git add raceroom-data/r3e-data.json assets/r3e
          if git diff --cached --quiet; then
            echo "Nothing new today."
          else
            git commit -m "Update RaceRoom data, pictures and car details"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          FLAGS=""
          # On a hand-started run with the box ticked, and every Monday, ask the store again about missing pictures.
          if [ "${{ github.event.inputs.recheck }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then FLAGS="--recheck-missing"; fi
          node tools/r3e-sync.mjs $FLAGS

      - name: Save anything new into the repo
        run: |
          git config user.name "Race Club picture sync"
          git config user.email "actions@users.noreply.github.com"
          git add raceroom-data/r3e-data.json assets/r3e
          if git diff --cached --quiet; then
            echo "Nothing new today."
          else
            git commit -m "Update RaceRoom data and pictures"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
